<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Soler Biz - 1인 사업자를 위한 사업 운영 대시보드" />
  <title>Soler Biz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <strong>SOLER BIZ</strong>
          <span>Business OS</span>
        </div>
      </div>

      <nav class="nav" aria-label="주요 메뉴">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span>대시보드</button>
        <button class="nav-item" data-page="finance"><span>↗</span>매출 · 매입</button>
        <button class="nav-item" data-page="tax"><span>◎</span>세금 · 신고</button>
        <button class="nav-item" data-page="clients"><span>◫</span>클라이언트</button>
        <button class="nav-item" data-page="projects"><span>◇</span>프로젝트</button>
        <button class="nav-item" data-page="people"><span>♙</span>인력 관리</button>
        <button class="nav-item" data-page="calendar"><span>□</span>사업 일정</button>
        <button class="nav-item" data-page="documents"><span>≡</span>문서 보관</button>
        <button class="nav-item" data-page="calculator"><span>＋</span>계산기</button>
        <button class="nav-item mobile-only" data-page="settings"><span>⚙</span>설정</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span>⚙</span>사업자 설정</button>
        <div class="profile-mini">
          <div class="avatar" id="avatar">P</div>
          <div>
            <strong id="miniName">내 사업자</strong>
            <span id="miniType">개인사업자</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1 id="pageTitle">대시보드</h1>
        </div>
        <div class="top-actions">
          <button class="ghost-btn" id="resetDemo">초기화</button>
          <button class="primary-btn" id="openQuick">+ 빠른 등록</button>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="onboardingModal">
    <div class="modal onboarding">
      <div class="modal-head">
        <div class="brand-mark large">S</div>
        <div>
          <p class="eyebrow">SOLER BIZ SETUP</p>
          <h2>사업 운영 정보를 먼저 설정해볼게요.</h2>
          <p>기본 정보만 입력하면 필요한 신고 일정과 관리 항목을 맞춤 구성합니다.</p>
        </div>
      </div>

      <form id="onboardingForm" class="form-grid">
        <label>상호명<input name="businessName" placeholder="예: 나인웍스" required /></label>
        <label>대표자명<input name="ownerName" placeholder="예: 박재영" required /></label>
        <label>사업자등록번호<input name="businessNumber" placeholder="000-00-00000" /></label>
        <label>사업장 주소<input name="address" placeholder="사업장 주소" /></label>
        <label>사업자 형태
          <select name="businessType">
            <option value="개인사업자">개인사업자</option>
            <option value="법인사업자">법인사업자</option>
          </select>
        </label>
        <label>과세 유형
          <select name="taxType">
            <option value="일반과세자">일반과세자</option>
            <option value="간이과세자">간이과세자</option>
            <option value="면세사업자">면세사업자</option>
          </select>
        </label>
        <label>업종<input name="industry" placeholder="예: 디자인 서비스업" /></label>
        <label>개업일<input name="startDate" type="date" /></label>

        <div class="check-card">
          <span>직원(4대보험) 고용</span>
          <label class="switch"><input name="hasEmployee" type="checkbox" /><i></i></label>
        </div>
        <div class="check-card">
          <span>3.3% 인력 사용</span>
          <label class="switch"><input name="hasFreelancer" type="checkbox" checked /><i></i></label>
        </div>

        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="demoStart">테스트 데이터로 시작</button>
          <button type="submit" class="primary-btn">대시보드 만들기</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="quickModal">
    <div class="modal compact">
      <div class="modal-title-row">
        <div><p class="eyebrow">QUICK ADD</p><h2>빠른 등록</h2></div>
        <button class="icon-btn" data-close="quickModal">×</button>
      </div>
      <form id="quickForm" class="form-grid one">
        <label>구분
          <select name="type">
            <option value="매출">매출</option>
            <option value="매입">매입</option>
          </select>
        </label>
        <label>내용<input name="title" placeholder="예: 브랜드 디자인 잔금" required /></label>
        <label>거래처<input name="client" placeholder="예: 건강미" /></label>
        <label>금액<input name="amount" type="number" min="0" placeholder="1000000" required /></label>
        <label>거래일<input name="date" type="date" required /></label>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" data-close="quickModal">취소</button>
          <button type="submit" class="primary-btn">등록</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
