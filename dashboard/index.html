<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Solarbiz. 사업 운영 대시보드" />
  <title>Dashboard — Solarbiz.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="icon" type="image/svg+xml" href="../assets/solarbiz-symbol.svg" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="auth-pending" data-auth-context="dashboard">
  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo brand-logo-sidebar brand-logo-full" src="../assets/solarbiz-logo.svg" alt="Solarbiz." />
        <img class="brand-logo brand-logo-sidebar-symbol" src="../assets/solarbiz-symbol.svg" alt="" aria-hidden="true" />
      </div>

      <nav class="nav" aria-label="주요 메뉴">
        <button class="nav-item active" data-page="dashboard"><img class="nav-icon" src="../assets/icons/dashboard.svg" alt="">대시보드</button>
        <button class="nav-item" data-page="finance"><img class="nav-icon" src="../assets/icons/invoice.svg" alt="">매출 · 매입</button>
        <button class="nav-item" data-page="tax"><img class="nav-icon" src="../assets/icons/tax.svg" alt="">세금 · 신고</button>
        <button class="nav-item" data-page="clients"><img class="nav-icon" src="../assets/icons/company.svg" alt="">클라이언트</button>
        <button class="nav-item" data-page="projects"><img class="nav-icon" src="../assets/icons/workflow.svg" alt="">프로젝트</button>
        <button class="nav-item" data-page="people"><img class="nav-icon" src="../assets/icons/team.svg" alt="">인력 관리</button>
        <button class="nav-item" data-page="calendar"><img class="nav-icon" src="../assets/icons/schedule.svg" alt="">사업 일정</button>
        <button class="nav-item" data-page="documents"><img class="nav-icon" src="../assets/icons/cloud.svg" alt="">문서 보관</button>
        <button class="nav-item" data-page="calculator"><img class="nav-icon" src="../assets/icons/analytics.svg" alt="">계산기</button>
        <button class="nav-item mobile-only" data-page="settings"><img class="nav-icon" src="../assets/icons/settings.svg" alt="">설정</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><img class="nav-icon" src="../assets/icons/settings.svg" alt="">사업자 설정</button>
        <div class="profile-mini">
          <div class="avatar" id="avatar">P</div>
          <div>
            <strong id="miniName">내 사업자</strong>
            <span id="miniType">개인사업자</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1 id="pageTitle">대시보드</h1>
        </div>
        <div class="top-actions">
          <span class="account-email" id="accountEmail"></span>
          <button class="ghost-btn" id="logoutBtn">로그아웃</button>
          <button class="ghost-btn" id="resetDemo">초기화</button>
          <button class="primary-btn" id="openQuick">+ 빠른 등록</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="onboardingModal">
    <div class="modal onboarding">
      <div class="modal-head onboarding-brand-head">
        <img class="brand-logo brand-logo-onboarding" src="../assets/solarbiz-logo.svg" alt="Solarbiz." />
        <div>
          <p class="eyebrow">BUSINESS SETUP</p>
          <h2>사업 운영 정보를 먼저 설정해볼게요.</h2>
          <p>기본 정보만 입력하면 필요한 신고 일정과 관리 항목을 맞춤 구성합니다.</p>
        </div>
      </div>
      <form id="onboardingForm" class="form-grid">
        <label>상호명<input name="businessName" placeholder="예: 나인웍스" required /></label>
        <label>대표자명<input name="ownerName" placeholder="예: 박재영" required /></label>
        <label>사업자등록번호<input name="businessNumber" placeholder="000-00-00000" /></label>
        <label>사업장 주소<input name="address" placeholder="사업장 주소" /></label>
        <label>사업자 형태<select name="businessType"><option value="개인사업자">개인사업자</option><option value="법인사업자">법인사업자</option></select></label>
        <label>과세 유형<select name="taxType"><option value="일반과세자">일반과세자</option><option value="간이과세자">간이과세자</option><option value="면세사업자">면세사업자</option></select></label>
        <label>업종<input name="industry" placeholder="예: 디자인 서비스업" /></label>
        <label>개업일<input name="startDate" type="date" /></label>
        <div class="check-card"><span>직원(4대보험) 고용</span><label class="switch"><input name="hasEmployee" type="checkbox" /><i></i></label></div>
        <div class="check-card"><span>3.3% 인력 사용</span><label class="switch"><input name="hasFreelancer" type="checkbox" checked /><i></i></label></div>
        <div class="check-card"><span>일용직 사용</span><label class="switch"><input name="hasDailyWorker" type="checkbox" /><i></i></label></div>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="demoStart">테스트 데이터로 시작</button>
          <button type="submit" class="primary-btn">대시보드 만들기</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="quickModal">
    <div class="modal compact">
      <div class="modal-title-row">
        <div><p class="eyebrow">QUICK ADD</p><h2>빠른 등록</h2></div>
        <button class="icon-btn" data-close="quickModal">×</button>
      </div>
      <form id="quickForm" class="form-grid one">
        <label>구분<select name="type"><option value="매출">매출</option><option value="매입">매입</option></select></label>
        <label>내용<input name="title" placeholder="예: 브랜드 디자인 잔금" required /></label>
        <label>거래처<input name="client" placeholder="예: 건강미" /></label>
        <label>금액<input name="amount" type="number" min="0" placeholder="1000000" required /></label>
        <label>금액 입력 기준
          <select name="amountMode">
            <option value="total">합계금액 (VAT 포함)</option>
            <option value="supply">공급가액</option>
          </select>
        </label>
        <label>부가세 처리
          <select name="taxable">
            <option value="taxable">과세 10%</option>
            <option value="exempt">면세 / 부가세 없음</option>
          </select>
        </label>
        <label>거래일<input name="date" type="date" required /></label>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" data-close="quickModal">취소</button>
          <button type="submit" class="primary-btn">등록</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="../config.js"></script>
  <script src="../auth.js"></script>
</body>
</html>
